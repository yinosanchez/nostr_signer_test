version: '3.8'

services:
  local-relay:
    image: scsibug/nostr-rs-relay:latest
    container_name: nostr-local-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - ./relay/config.toml:/usr/src/app/config.toml:ro
    networks:
      - nostr-net

  local-signer-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: nostr-local-signer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - RELAY_INTERNAL_URL=ws://local-relay:7777
      - RELAY_EXTERNAL_URL=ws://localhost:7777
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - local-relay
    networks:
      - nostr-net

networks:
  nostr-net:
    driver: bridge

